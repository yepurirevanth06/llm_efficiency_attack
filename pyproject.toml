[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-efficiency-attack"
version = "0.1.0"
description = "General-purpose white-box efficiency (sponge) attack toolbox for Hugging Face LLMs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1,<3.0",
    "transformers>=4.40,<5.0",
    "numpy>=1.24,<2.0",
    "sentencepiece>=0.1.99,<0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]
